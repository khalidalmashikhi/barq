name: Claude (issue / PR tasks)

# 2026-10-20 (engineering-workflow hardening) — prepared, INERT until the owner opts in.
#
# Lets a repository owner / collaborator ask Claude for a change by mentioning @claude in an issue
# or PR comment. Claude's work arrives ONLY as commits on a reviewable branch / pull request, which
# then goes through normal CI (ci.yml, secret-scan.yml) and human review before any merge. This
# workflow has no deployment credential (no Vercel token exists in GitHub secrets) and cannot
# deploy staging or production; the repository's own .claude/settings.json deny rules and guard
# hook apply inside the run as well.
#
# OWNER ACTIONS to enable (nothing here works until then — see the runbook §8):
#   1. Install the Claude GitHub App on this repository (https://github.com/apps/claude).
#   2. Add the secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions). Never commit it.
#   3. Add the repository VARIABLE  CLAUDE_GITHUB_ENABLED = true.
#   4. Protect `staging` and `main` (require PR + passing CI) so no workflow token can push to them.
#
# The repository is PUBLIC: runs are limited to comments by the OWNER / MEMBER / COLLABORATOR
# (on top of the action's own write-access check), so a stranger's "@claude" does nothing.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      vars.CLAUDE_GITHUB_ENABLED == 'true' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push to Claude's own branch only (staging/main protected by the owner)
      pull-requests: write # open / comment on the reviewable PR
      issues: write # reply on the issue
      id-token: write # Claude GitHub App authentication
      actions: read # read CI results on the PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (the repository's guard hook runs on node)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 40
            --disallowedTools "Bash(npx vercel:*) Bash(vercel:*) Bash(gh secret:*) Bash(git push --force:*) Bash(git push -f:*) Bash(npx prisma migrate deploy:*) Bash(npx prisma db:*)"
