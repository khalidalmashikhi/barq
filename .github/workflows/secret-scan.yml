name: Secret scan

# 2026-10-20 (engineering-workflow hardening). Scans EVERY commit a push or PR adds — not only the
# final diff — so a credential committed and then removed is still caught (it stays in history).
# Complements GitHub secret scanning + push protection (enabled on this repository). Deliberately
# NO concurrency cancellation: a newer push never aborts a scan that is already running.
# Findings print file, line and rule only — never the value. Uses only the repository's own
# zero-dependency script (scripts/engineering/secret-scan.mjs); no third-party action, no secret.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  scan:
    name: Scan added commits for credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # a PR always adds >= 1 commit: zero commits = wrong base, which must FAIL, not pass
            node scripts/engineering/secret-scan.mjs --base "origin/$PR_BASE" --require-commits
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/engineering/secret-scan.mjs --range "$BEFORE..HEAD"
          else
            # new branch (or rewritten history): every commit not yet on staging
            node scripts/engineering/secret-scan.mjs --base origin/staging
          fi
